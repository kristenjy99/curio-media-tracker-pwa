# Dựng bản PWA và đưa lên GitHub Pages.
# Chạy khi push lên nhánh main, hoặc bấm tay ở tab Actions → "Deploy PWA to GitHub Pages" → Run workflow.
# Điều kiện một lần: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Chạy npm test trước khi build'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Không cho hai lần deploy chạy chồng nhau; lần mới đợi lần cũ xong.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        if: github.event_name == 'push' || inputs.run_tests
        run: npm test

      # Repo <user>.github.io được phục vụ ở gốc domain; mọi repo khác ở /<tên-repo>/.
      - name: Tính BASE_PATH
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [ "$repo" = "${{ github.repository_owner }}.github.io" ]; then echo "path=/" >> "$GITHUB_OUTPUT"; else echo "path=/$repo/" >> "$GITHUB_OUTPUT"; fi

      - name: Build PWA
        run: npm run build:pwa
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
